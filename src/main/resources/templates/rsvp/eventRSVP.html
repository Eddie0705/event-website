
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
<title>PAGE_TITLE</title>
    <!-- <link rel="stylesheet" th:href="@{/css/style.css}"> -->
     <link rel="stylesheet" th:href="@{/css/eventRSVP.css}">
</head>

<div layout:fragment="content">
<!-- Your page content here -->
<body>
    
    <!-- RSVP Page code starts here -->
    <div id="rsvpPage">
        <!-- header and subtitle -->
        <div class="header">
            <div class="content">
                <h1 class="page-title">My events RSVP</h1>
                <p class="page-subtitle">Manage all your Event RSVP</p>
                <!-- summary card -->
                <div class="summary-cards">
                    <div class="summary-card card-upcoming">
                        <div class="summary-number" th:text="${yes.size()}"></div>
                        <div class="summary-label">Yes</div>
                    </div>

                    <div class="summary-card card-going">
                        <div class="summary-number" th:text="${no.size()}"></div>
                        <div class="sumary-label">No</div>
                    </div>

                    <div class="summary-card card-maybe">
                        <div class="summary-number" th:text="${maybe.size()}" ></div>
                        <div class="sumary-label">Maybe</div>
                    </div>
                    <div class="summary-card card-past">
                        <div class="summary-number " th:text="${cancelled.size()}"></div>
                        <div class="summary-label">Cancelled</div>
                    </div>
                </div>
            </div>
        </div>
        <!-- end of header -->

        <!-- filter buttons -->
        <div class="filters">
            <h1> Your Events</h1>
            <div class ='filter-buttons'>
                <button class="filter-btn" onclick="filterEvents('upcoming')">Upcoming Events</button>
                <button class="filter-btn">Confirmed</button>
                <button class="filter-btn">Declined</button>
                <button class="filter-btn"onclick="filterEvents('past')" >Past Events</button>
            </div>
        </div>
         <!-- end of filter button -->

         <!-- event card section rsvp -->
        <div class="events-section">
            <h2 id="events-section-title" class="events-section-title"></h2> 

           <!-- <p th:text="${yes != null ? #lists.size(yes) + ' RSVPs found for Yes' : 'No RSVPs'}"></p> -->
            <div id="upcoming-section">
                <div class="event-grid">
                    <div class="event-card" 
                    th:each="rsvp : ${yes}"
                    th:attr="data-date=${rsvp.event.eventDate}">
                        <div class="event-content">
                            <div class="event-date" th:text="|${#temporals.format(rsvp.event.eventDate, 'dd MMM yyyy')} • ${#temporals.format(rsvp.event.startTime, 'hh:mm a')}|">Date</div>
                            <div class="event-title" th:text="${rsvp.event.title}">Title</div>
                            <div class="event-location" th:text=" At + ' ' +${rsvp.event.getLocation}"> </div>
                            <div class="status-indicator" th:text="${rsvp.event.getDescription}">Going</div>
                            <div class="event-stats">
                                <div class="attendee-count" th:text="${rsvp.event.maxCapacity} + ' ' +  Attendees"></div>
                                <div class="attendee-count" th:text="${rsvp.event.venueDetails}"></div>
                                <div class="attendee-count" th text="${rsvp.event.currentRsvpCount} + ' ' + attending"></div>
                                <div class="status-indicator" th:text="${rsvp.rsvpStatus}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <h2 id="events-section-title" class="events-section-title"></h2>
            <div id="confirmed-section">
                <div class ="event-grid">
                    <div class ="event-card" th:each="rsvp : ${no}">
                        <div class="event-content">
                            <div class="event-date" th:text="|${#temporals.format(rsvp.event.eventDate, 'dd MMM yyyy')} • ${#temporals.format(rsvp.event.startTime, 'hh:mm a')}|">Date</div>
                            <div class="event-title" th:text="${rsvp.event.title}">Title</div>
                            <div class="event-location" th:text=" At + ' ' +${rsvp.event.getLocation}"> </div>
                            <div class="status-indicator" th:text="${rsvp.event.getDescription}">Going</div>
                            <div class="event-stats">
                                <div class="attendee-count" th:text="${rsvp.event.maxCapacity} + ' ' +  Attendees"></div>
                                <div class="attendee-count" th text="${rsvp.event.currentRsvpCount} + ' ' + attending"></div>
                                <div class="status-indicator" th:text="${rsvp.rsvpStatus}">Going</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <h2 id="events-section-title" class="events-section-title"></h2>
            <div id="declined-section">
                <div class ="event-grid">
                    <div class="event-card" th:each="rsvp : ${maybe}">
                        <div class="event-content">
                            <div class="event-date" th:text="|${#temporals.format(rsvp.event.eventDate, 'dd MMM yyyy')} • ${#temporals.format(rsvp.event.startTime, 'hh:mm a')}|">Date</div>
                            <div class="event-title" th:text="${rsvp.event.title}">Title</div>
                            <div class="event-location" th:text=" At + ' ' +${rsvp.event.getLocation}"> </div>
                            <div class="status-indicator" th:text="${rsvp.event.getDescription}"></div>
                            <div class="event-stats">
                                <div class="attendee-count" th:text="${rsvp.event.maxCapacity} + ' ' +  Attendees"></div>
                                <div class="attendee-count" th text="${rsvp.event.currentRsvpCount} + ' ' + attending"></div> 
                                <div class="status-indicator" th:text="${rsvp.rsvpStatus}">Going</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <h2 id="events-section-title" class="events-section-title"></h2>
            <div id="past-section">
                <div class ="event-grid">
                    <div class="event-card cancelled" th:each="rsvp : ${cancelled}">
                        <div class="event-content">
                            <div class="event-date" th:text="|${#temporals.format(rsvp.event.eventDate, 'dd MMM yyyy')} • ${#temporals.format(rsvp.event.startTime, 'hh:mm a')}|">Date</div>
                            <div class="event-title" th:text="${rsvp.event.title}">Title</div>
                            <div class="event-location" th:text=" At + ' ' +${rsvp.event.getLocation}"> </div>
                            <div class="status-indicator" th:text="${rsvp.event.getDescription}">Going</div>
                            <div class="event-stats">
                                <div class="attendee-count" th:text="${rsvp.event.maxCapacity} + ' ' +  Attendees"></div>
                                <div class="attendee-count" th text="${rsvp.event.currentRsvpCount} + ' ' + attending"></div>
                                <div class="status-indicator" th:text="${rsvp.rsvpStatus}">Going</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
