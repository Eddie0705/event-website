<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"></html>
<head>
    <title>Landing Page</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
     <link rel="stylesheet" th:href="@{/css/eventRSVP.css}">
</head>

<body>
    <!-- navigation bar from index page -->
    <nav class="nav"> 
        <div class="left-nav">
            <a class="logo" th:href="@{/Index}" style="color: red ; font-weight:bold; border-color: black;">EVENTHUB</a>
        </div>
        <div class ="mid-nav">
            <a class="home" th:href="@{/Index}">Home</a> 
            <a class="explore" th:href="@{/explore}">Explore</a> 
            <a class="calendar" th:href="@{/calendar}">Calendar</a>

            <a class="profile" th:href="@{/profile}">Profile</a> 
        </div>
    </nav>

        <div class="header">
