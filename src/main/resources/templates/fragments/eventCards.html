<th:block th:fragment="eventsContainer">
    <div class="events_card" th:each="event : ${events}">
        <h3 th:text="${event.title}">Event Title</h3>

        <p>
            <span th:text="${event.eventDate != null ? event.eventDate.format(T(java.time.format.DateTimeFormatter).ofPattern('dd MMM yyyy')) : ''}"></span>
            |
            <span th:text="${event.startTime}">Start Time</span>
        </p>

        <p th:text="${event.description != null ? event.description : 'No Description'}"></p>
        <p th:text="'Location: ' + (event.location != null ? ${event.location} : 'No Location')"></p>
        <p th:text="${event.price == null or event.price.compareTo(T(java.math.BigDecimal).ZERO) == 0 ? 'Price: Free' : 'Price: $' + event.price}"></p>

        <!-- Button container -->
        <div class="event-buttons">
            <button type="button" class="view-button" th:onclick="'window.location.href=\'/events/' + ${event.eventId} + '\''">
                View
            </button>

            <div style="flex: 1;">
                <form style="margin: 0;">
                    <input type="hidden" name="userId" th:value="${currentUser != null ? currentUser.userId : 0}" />
                    <input type="hidden" name="eventId" th:value="${event.eventId}" />
                    <input type="hidden" name="rsvpStatus" value="yes" />

                    <button type="button"
                            th:if="${currentUser == null and !event.isEventFinished()}"
                            onclick="window.location.href='/auth/login'">
                        Login to RSVP
                    </button>

                    <button type="button"
                            th:if="${currentUser == null and event.isEventFinished()}"
                            class="rsvp-status event-finished"
                            disabled="true">
                        Event Finished
                    </button>

                    <div th:if="${currentUser != null}">
                        <button type="button"
                                th:if="${event.isEventFinished()}"
                                class="rsvp-status event-finished"
                                disabled="true">
                            Event Finished
                        </button>

                        <button type="button"
        th:if="${!event.isEventFinished() and rsvpService.checkUserRsvp(event, currentUser) != 'yes'}"
        class="rsvp-status not-rsvped"
        disabled="true">
    Not RSVP'd
</button>

<button type="button"
        th:if="${!event.isEventFinished() and rsvpService.checkUserRsvp(event, currentUser) == 'yes'}"
        class="rsvp-status rsvped"
        disabled="true">
    RSVP'd
</button>

                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(events)}">
        <p style="text-align:center; color:#6b7280;">No events found.</p>
    </div>
</th:block>
