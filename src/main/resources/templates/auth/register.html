<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Register</title>
</head>

<th:block layout:fragment="css">
    <style>
        /* Override main content to center the registration form */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 140px);
            padding: 20px;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 550px;
            position: relative;
            overflow: hidden;
        }

        .register-container:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: #6b7280;
            font-size: 1rem;
            font-weight: 500;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #374151;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #ffffff;
            color: #1f2937;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
            background: #fffbf0;
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .form-group input.is-invalid {
            border-color: #ef4444;
            background: #fef2f2;
        }

        .form-group input.is-valid {
            border-color: #10b981;
            background: #f0fdf4;
        }

        /* User Type Selection */
        .user-type-selection {
            margin-bottom: 2rem;
        }

        .user-type-title {
            color: #374151;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
        }

        .user-type-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .user-type-option {
            position: relative;
        }

        .user-type-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .user-type-card {
            display: block;
            padding: 1.5rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #ffffff;
        }

        .user-type-card:hover {
            border-color: #fbbf24;
            background: #fffbf0;
        }

        .user-type-option input[type="radio"]:checked + .user-type-card {
            border-color: #fbbf24;
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            color: white;
        }

        .user-type-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .user-type-option input[type="radio"]:checked + .user-type-card .user-type-icon {
            color: white;
        }

        .user-type-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .user-type-desc {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        /* Password strength indicator */
        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.875rem;
        }

        .strength-weak {
            color: #ef4444;
        }

        .strength-medium {
            color: #f59e0b;
        }

        .strength-strong {
            color: #10b981;
        }

        /* Terms checkbox */
        .terms-group {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 2rem;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 8px;
        }

        .terms-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #fbbf24;
            margin-top: 2px;
        }

        .terms-group label {
            font-size: 0.9rem;
            color: #374151;
            margin: 0;
        }

        .terms-group a {
            color: #fbbf24;
            text-decoration: none;
            font-weight: 500;
        }

        .terms-group a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            color: #1f2937;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover:before {
            left: 100%;
        }

        .login-link {
            text-align: center;
            color: #6b7280;
            font-size: 0.95rem;
        }

        .login-link a {
            color: #fbbf24;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #f59e0b;
            text-decoration: underline;
        }

        /* Error and Success Messages */
        .alert-message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .field-error {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        /* Loading state */
        .loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .loading .submit-btn {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* Animations */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-container {
            animation: slideInUp 0.6s ease-out;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .register-container {
                padding: 2rem 1.5rem;
                margin: 10px;
            }
            
            .logo h1 {
                font-size: 2rem;
            }
            
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            
            .user-type-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</th:block>

<div layout:fragment="content">
    <div class="register-container">
        <div class="logo">
            <h1>EVENTHUB</h1>
            <p>Join the Campus Event Community</p>
        </div>

        <!-- Error Messages -->
        <div th:if="${errorMessage}" class="alert-message alert-error" th:text="${errorMessage}">
            Error message here
        </div>

        <!-- Registration Form -->
        <form th:action="@{/auth/register}" th:object="${user}" method="post" id="registerForm">
            
            <!-- User Type Selection -->
            <div class="user-type-selection">
                <h3 class="user-type-title">What describes you best?</h3>
                <div class="user-type-options">
                    <div class="user-type-option">
                        <input type="radio" id="student" name="userType" value="student" checked>
                        <label for="student" class="user-type-card">
                            <div class="user-type-icon">🎓</div>
                            <div class="user-type-name">Student</div>
                            <div class="user-type-desc">Discover and attend events</div>
                        </label>
                    </div>
                    <div class="user-type-option">
                        <input type="radio" id="organiser" name="userType" value="organiser">
                        <label for="organiser" class="user-type-card">
                            <div class="user-type-icon">🎪</div>
                            <div class="user-type-name">Organiser</div>
                            <div class="user-type-desc">Create and manage events</div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Name Fields -->
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" 
                           id="firstName" 
                           th:field="*{firstName}"
                           placeholder="Enter your first name" 
                           required>
                    <div th:if="${#fields.hasErrors('firstName')}" class="field-error">
                        <span th:errors="*{firstName}"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" 
                           id="lastName" 
                           th:field="*{lastName}"
                           placeholder="Enter your last name" 
                           required>
                    <div th:if="${#fields.hasErrors('lastName')}" class="field-error">
                        <span th:errors="*{lastName}"></span>
                    </div>
                </div>
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" 
                       id="email" 
                       th:field="*{email}"
                       placeholder="Enter your email address" 
                       required>
                <div th:if="${#fields.hasErrors('email')}" class="field-error">
                    <span th:errors="*{email}"></span>
                </div>
            </div>

            <!-- Username Field -->
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" 
                       id="username" 
                       th:field="*{username}"
                       placeholder="Choose a unique username" 
                       required>
                <div th:if="${#fields.hasErrors('username')}" class="field-error">
                    <span th:errors="*{username}"></span>
                </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" 
                       id="password" 
                       th:field="*{passwordHash}"
                       placeholder="Create a strong password" 
                       required>
                <div th:if="${#fields.hasErrors('passwordHash')}" class="field-error">
                    <span th:errors="*{passwordHash}"></span>
                </div>
                <div class="password-strength" id="passwordStrength"></div>
            </div>

            <!-- Confirm Password Field -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" 
                       id="confirmPassword" 
                       name="confirmPassword"
                       placeholder="Confirm your password" 
                       required>
                <div class="password-strength" id="passwordMatch"></div>
            </div>

            <!-- Terms Agreement -->
            <div class="terms-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    I agree to the <a th:href="@{/terms}" target="_blank">Terms of Service</a>
                    and <a th:href="@{/privacy}" target="_blank">Privacy Policy</a>
                </label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Create Your EventHub Account
            </button>
        </form>

        <div class="login-link">
            Already have an account? <a th:href="@{/auth/login}">Sign in here</a>
        </div>
    </div>
</div>

<th:block layout:fragment="javascript">
    <script>
        // Password strength checker
        document.getElementById('password').addEventListener('input', function () {
            const password = this.value;
            const strengthDiv = document.getElementById('passwordStrength');
            const passwordInput = this;

            if (password.length === 0) {
                strengthDiv.innerHTML = '';
                passwordInput.classList.remove('is-valid', 'is-invalid');
                return;
            }

            let strength = 0;
            let feedback = [];

            if (password.length >= 8) strength++;
            else feedback.push('at least 8 characters');

            if (/[a-z]/.test(password)) strength++;
            else feedback.push('lowercase letter');

            if (/[A-Z]/.test(password)) strength++;
            else feedback.push('uppercase letter');

            if (/[0-9]/.test(password)) strength++;
            else feedback.push('number');

            if (/[^A-Za-z0-9]/.test(password)) strength++;
            else feedback.push('special character');

            let strengthText = '';
            let strengthClass = '';

            if (strength < 3) {
                strengthText = 'Weak password. Needs: ' + feedback.join(', ');
                strengthClass = 'strength-weak';
                passwordInput.classList.add('is-invalid');
                passwordInput.classList.remove('is-valid');
            } else if (strength < 5) {
                strengthText = 'Medium strength password';
                strengthClass = 'strength-medium';
                passwordInput.classList.remove('is-invalid', 'is-valid');
            } else {
                strengthText = 'Strong password!';
                strengthClass = 'strength-strong';
                passwordInput.classList.add('is-valid');
                passwordInput.classList.remove('is-invalid');
            }

            strengthDiv.innerHTML = '<span class="' + strengthClass + '">' + strengthText + '</span>';
        });

        // Password match checker
        document.getElementById('confirmPassword').addEventListener('input', function () {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            const matchDiv = document.getElementById('passwordMatch');
            const confirmInput = this;

            if (confirmPassword.length === 0) {
                matchDiv.innerHTML = '';
                confirmInput.classList.remove('is-valid', 'is-invalid');
                return;
            }

            if (password === confirmPassword) {
                matchDiv.innerHTML = '<span class="strength-strong">Passwords match!</span>';
                confirmInput.classList.add('is-valid');
                confirmInput.classList.remove('is-invalid');
            } else {
                matchDiv.innerHTML = '<span class="strength-weak">Passwords do not match</span>';
                confirmInput.classList.add('is-invalid');
                confirmInput.classList.remove('is-valid');
            }
        });

        // Form submission handling
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            
            // Validate password match
            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Passwords do not match!');
                return false;
            }
            
            // Validate terms agreement
            if (!terms) {
                e.preventDefault();
                alert('Please agree to the Terms of Service and Privacy Policy');
                return false;
            }
            
            // Add loading state
            const submitBtn = document.getElementById('submitBtn');
            const form = document.getElementById('registerForm');
            
            form.classList.add('loading');
            submitBtn.textContent = 'Creating Account...';
        });

        // Auto-focus first field
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('firstName').focus();
        });

        // Real-time email validation
        document.getElementById('email').addEventListener('blur', function() {
            const email = this.value;
            if (email) {
                // Check if email already exists (you can implement this via AJAX)
                // For now, just basic format validation
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (emailRegex.test(email)) {
                    this.classList.add('is-valid');
                    this.classList.remove('is-invalid');
                } else {
                    this.classList.add('is-invalid');
                    this.classList.remove('is-valid');
                }
            }
        });

        // Real-time username validation
        document.getElementById('username').addEventListener('blur', function() {
            const username = this.value;
            if (username && username.length >= 3) {
                this.classList.add('is-valid');
                this.classList.remove('is-invalid');
            } else if (username) {
                this.classList.add('is-invalid');
                this.classList.remove('is-valid');
            }
        });
    </script>
</th:block>
</html>
