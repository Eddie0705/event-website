<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .auth-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 500px;
        }

        .auth-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .auth-header h2 {
            margin: 0;
            font-weight: 600;
        }

        .auth-body {
            padding: 2rem;
        }

        .form-floating {
            margin-bottom: 1rem;
        }

        .form-floating input {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .form-floating input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .form-floating input.is-invalid {
            border-color: #dc3545;
        }

        .form-floating input.is-valid {
            border-color: #198754;
        }

        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .auth-links {
            text-align: center;
            margin-top: 1.5rem;
        }

        .auth-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 10px;
            border: none;
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .back-home:hover {
            color: #f8f9fa;
            text-decoration: none;
        }

        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.875rem;
        }

        .strength-weak {
            color: #dc3545;
        }

        .strength-medium {
            color: #ffc107;
        }

        .strength-strong {
            color: #198754;
        }

        .row {
            margin: 0 -0.5rem;
        }

        .col-md-6 {
            padding: 0 0.5rem;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <a href="/" class="back-home">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <h2>Join EventHub</h2>
                <p class="mb-0">Create your account to start exploring events</p>
            </div>

            <div class="auth-body">
                <!-- Error Message -->
                <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <!-- Registration Form -->
                <form th:action="@{/auth/register}" th:object="${user}" method="post">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="firstName" th:field="*{firstName}"
                                    placeholder="First Name" required>
                                <label for="firstName">
                                    <i class="fas fa-user"></i> First Name
                                </label>
                                <div th:if="${#fields.hasErrors('firstName')}" class="invalid-feedback d-block">
                                    <span th:errors="*{firstName}"></span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="lastName" th:field="*{lastName}"
                                    placeholder="Last Name" required>
                                <label for="lastName">
                                    <i class="fas fa-user"></i> Last Name
                                </label>
                                <div th:if="${#fields.hasErrors('lastName')}" class="invalid-feedback d-block">
                                    <span th:errors="*{lastName}"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-floating">
                        <input type="email" class="form-control" id="email" th:field="*{email}"
                            placeholder="Email Address" required>
                        <label for="email">
                            <i class="fas fa-envelope"></i> Email Address
                        </label>
                        <div th:if="${#fields.hasErrors('email')}" class="invalid-feedback d-block">
                            <span th:errors="*{email}"></span>
                        </div>
                    </div>

                    <div class="form-floating">
                        <input type="text" class="form-control" id="username" th:field="*{username}"
                            placeholder="Username" required>
                        <label for="username">
                            <i class="fas fa-at"></i> Username
                        </label>
                        <div th:if="${#fields.hasErrors('username')}" class="invalid-feedback d-block">
                            <span th:errors="*{username}"></span>
                        </div>
                    </div>

                    <div class="form-floating">
                        <input type="password" class="form-control" id="password" th:field="*{passwordHash}"
                            placeholder="Password" required>
                        <label for="password">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <div th:if="${#fields.hasErrors('passwordHash')}" class="invalid-feedback d-block">
                            <span th:errors="*{passwordHash}"></span>
                        </div>
                        <div class="password-strength" id="passwordStrength"></div>
                    </div>

                    <div class="form-floating">
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                            placeholder="Confirm Password" required>
                        <label for="confirmPassword">
                            <i class="fas fa-lock"></i> Confirm Password
                        </label>
                        <div id="passwordMatch" class="password-strength"></div>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label" for="terms">
                            I agree to the <a href="#" class="text-decoration-none">Terms of Service</a>
                            and <a href="#" class="text-decoration-none">Privacy Policy</a>
                        </label>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-register">
                            <i class="fas fa-user-plus"></i> Create Account
                        </button>
                    </div>
                </form>

                <div class="auth-links">
                    <p class="mb-0">
                        Already have an account?
                        <a href="/auth/login">Sign in here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Password strength checker
        document.getElementById('password').addEventListener('input', function () {
            const password = this.value;
            const strengthDiv = document.getElementById('passwordStrength');

            if (password.length === 0) {
                strengthDiv.innerHTML = '';
                return;
            }

            let strength = 0;
            let feedback = [];

            if (password.length >= 8) strength++;
            else feedback.push('at least 8 characters');

            if (/[a-z]/.test(password)) strength++;
            else feedback.push('lowercase letter');

            if (/[A-Z]/.test(password)) strength++;
            else feedback.push('uppercase letter');

            if (/[0-9]/.test(password)) strength++;
            else feedback.push('number');

            if (/[^A-Za-z0-9]/.test(password)) strength++;
            else feedback.push('special character');

            let strengthText = '';
            let strengthClass = '';

            if (strength < 3) {
                strengthText = 'Weak password. Needs: ' + feedback.join(', ');
                strengthClass = 'strength-weak';
            } else if (strength < 5) {
                strengthText = 'Medium strength password';
                strengthClass = 'strength-medium';
            } else {
                strengthText = 'Strong password!';
                strengthClass = 'strength-strong';
            }

            strengthDiv.innerHTML = '<span class="' + strengthClass + '">' + strengthText + '</span>';
        });

        // Password match checker
        document.getElementById('confirmPassword').addEventListener('input', function () {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            const matchDiv = document.getElementById('passwordMatch');

            if (confirmPassword.length === 0) {
                matchDiv.innerHTML = '';
                return;
            }

            if (password === confirmPassword) {
                matchDiv.innerHTML = '<span class="strength-strong">Passwords match!</span>';
            } else {
                matchDiv.innerHTML = '<span class="strength-weak">Passwords do not match</span>';
            }
        });
    </script>
</body>

</html>
