<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Home</title>
</head>
<!-- Page-specific CSS -->
<th:block layout:fragment="css">
    <style>
        /* Search Area */
        .search_area {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            margin: 2rem;
            padding: 2rem;
            border-radius: 20px;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .search_area input[type="text"] {
            flex: 2;
            padding: 12px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .search_area input[type="text"]:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search_area select {
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search_area select:focus {
            outline: none;
            border-color: #6366f1;
        }

        .search_area input[type="date"] {
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        .search_area input[type="submit"] {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .search_area input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .search_area input[type="submit"]:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .search_area input[type="submit"]:hover:before {
            left: 100%;
        }

        /* Main Content Layout */
        .main_content {
            display: flex;
            gap: 2rem;
            margin: 2rem;
            align-items: flex-start;
        }

        /* Filter Sidebar */
        .filter {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            width: 300px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 120px;
        }

        .filter h1 {
            color: #1f2937;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            text-align: center;
        }

        .filter h2 {
            color: #374151;
            margin: 1.5rem 0 1rem 0;
            font-size: 1.1rem;
            border-bottom: 2px solid #6366f1;
            padding-bottom: 0.5rem;
        }

        .filter-group {
            margin: 0.8rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter input[type="checkbox"], .filter input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #6366f1;
        }

        .filter label {
            cursor: pointer;
            font-weight: 500;
        }

        .filter input[type="date"], .filter select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 0.5rem;
        }

        /* Events Container */
        .events_container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .events_card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .events_card:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
        }

        .events_card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .events_card h3 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: #1f2937;
            font-weight: 600;
        }

        .events_card p {
            color: #6b7280;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .events_card p:last-of-type {
            margin-bottom: 1.5rem;
            color: #374151;
            font-weight: 600;
        }

        .events_card button {
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            color: #1f2937;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .events_card button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.4);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .search_area {
                flex-direction: column;
                align-items: stretch;
                margin: 1rem;
            }

            .search_area input[type="text"] {
                min-width: auto;
            }

            .main_content {
                flex-direction: column;
                margin: 1rem;
            }

            .filter {
                width: 100%;
                position: static;
            }

            .events_container {
                grid-template-columns: 1fr;
            }
        }

        /* Animation for page load */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .events_card {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .events_card:nth-child(2) { animation-delay: 0.1s; }
        .events_card:nth-child(3) { animation-delay: 0.2s; }
        .events_card:nth-child(4) { animation-delay: 0.3s; }
    </style>
</th:block>

<!-- Page Content (Navigation and Footer are handled by the layout) -->
<div layout:fragment="content">
    <!-- Search Area -->


    <div class="search_area">
        <input type="text" id="searchText" placeholder="Search...">
        <select name="category" id="category">
            <option value="all">All</option>
            <option value="events">Events</option>
            <option value="users">Users</option>
            <option value="groups">Groups</option>
        </select>
        <input type="date" id="datePreferred" name="date_preferred">
        <select name="location" id="location">
            <option value="any">Any Location</option>
            <option value="newyork">New York</option>
            <option value="losangeles">Los Angeles</option>
            <option value="chicago">Chicago</option>
        </select>
        <input type="submit" id="searchBtn" value="Search"/>
    </div>

    <!-- Main Content Area -->
    <div class="main_content">
        <!-- Filter Sidebar -->
        <div class="filter">
            <h1>Filters</h1>
          
            <!-- Category -->
            <h2>Category</h2>
            <div class="filter-group">
              <input type="checkbox" name="categoryFilter" value="All" checked>
              <label>All</label>
            </div>
            <div class="filter-group">
              <input type="checkbox" name="categoryFilter" value="Academic">
              <label>Academic</label>
            </div>
            <div class="filter-group">
              <input type="checkbox" name="categoryFilter" value="Social">
              <label>Social</label>
            </div>
            <div class="filter-group">
              <input type="checkbox" name="categoryFilter" value="Sport">
              <label>Sport</label>
            </div>
          
            <!-- Date -->
            <h2>Date Range</h2>
            <input type="date" id="date_from">
            <input type="date" id="date_to">
          
            <!-- Location -->
            <h2>Location</h2>
            <div class="filter-group">
              <input type="checkbox" name="locations" value="Any" checked>
              <label>Any Location</label>
            </div>
            <div class="filter-group">
              <input type="checkbox" name="locations" value="Main Campus">
              <label>Main Campus</label>
            </div>
            <div class="filter-group">
              <input type="checkbox" name="locations" value="Student Center">
              <label>Student Center</label>
            </div>
          
            <!-- Price -->
            <h2>Price</h2>
            <div class="filter-group">
              <input type="radio" name="price" value="any" checked>
              <label>Any</label>
            </div>
            <div class="filter-group">
              <input type="radio" name="price" value="free">
              <label>Free</label>
            </div>
            <div class="filter-group">
              <input type="radio" name="price" value="paid">
              <label>Paid</label>
            </div>
          
            <!-- Organizer -->
            <h2>Organizer</h2>
            <select id="organizer">
              <option value="any" selected>Any Organizer</option>
              <option value="org1">Organizer 1</option>
              <option value="org2">Organizer 2</option>
              <option value="org3">Organizer 3</option>
            </select>
          </div>          

       <!-- Events Container -->
       <div class="events_container" id="eventsContainer" th:replace="fragments/eventCards :: eventsContainer"> 
            </div>
        </div>
    </div>
</div>
</html>

<script>
    /* ===========================
       🔍 Unified Search Function
       =========================== */
       async function doSearch() {
  const params = new URLSearchParams();

  // --- Top Search Bar ---
  const search = document.getElementById('searchText').value.trim();
  const categorySelect = document.getElementById('category').value;
  const date = document.getElementById('datePreferred').value;
  const locationSelect = document.getElementById('location').value;

  if (search) params.set('search', search);
  if (categorySelect && categorySelect !== 'all') params.set('category', categorySelect);
  if (date) params.set('date', date);
  if (locationSelect && locationSelect !== 'any') params.set('location', locationSelect);

  // --- Sidebar Filters ---

  // ✅ Category checkboxes (Academic, Social, Sport)
  const categories = Array.from(document.querySelectorAll('.filter input[name="categoryFilter"]:checked'))
    .map(el => el.value);
  if (categories.length > 0 && !categories.includes('All')) {
    categories.forEach(v => params.append('category', v));
  }

  // ✅ Location checkboxes
  const locations = Array.from(document.querySelectorAll('input[name="locations"]:checked'))
    .map(el => el.value);
  if (locations.length > 0 && !locations.includes('Any')) {
    // You can only send one location at a time (backend expects String)
    params.set('location', locations[0]);
  }

  // ✅ Date range
  const dateFrom = document.getElementById('date_from').value;
  const dateTo = document.getElementById('date_to').value;
  if (dateFrom) params.set('dateFrom', dateFrom);
  if (dateTo) params.set('dateTo', dateTo);

  // ✅ Price radio
  const price = document.querySelector('input[name="price"]:checked');
  if (price && price.value !== 'any') params.set('price', price.value);

  // ✅ Organizer dropdown
  const organizer = document.getElementById('organizer').value;
  if (organizer && organizer !== 'any') params.set('organizer', organizer);

  // --- Fetch from backend ---
  const response = await fetch(`/events/search?${params.toString()}`, {
    method: 'GET',
    headers: { 'X-Requested-With': 'XMLHttpRequest' },
    credentials: 'include'
  });

  const html = await response.text();
  const container = document.getElementById('eventsContainer');
  container.outerHTML = html;
}
    
    /* ===========================
       🔘 Manual Search Button
       =========================== */
    document.getElementById('searchBtn').addEventListener('click', async (event) => {
      event.preventDefault();
      await doSearch();
    });
    
    /* ===========================
       ⚡ Auto-trigger Filters
       =========================== */
    document.querySelectorAll('.filter input[type="checkbox"]').forEach(el => {
      el.addEventListener('change', doSearch);
    });
    document.querySelectorAll('.filter input[name="price"]').forEach(el => {
      el.addEventListener('change', doSearch);
    });
    document.getElementById('date_from').addEventListener('change', doSearch);
    document.getElementById('date_to').addEventListener('change', doSearch);
    document.getElementById('organizer').addEventListener('change', doSearch);

    // ===========================
// 🟢 "All"/"Any" Filter Logic
// ===========================

// ----- Handle "All" for Category -----
const allCategoryCheckbox = document.querySelector('input[name="categoryFilter"][value="All"]');
const otherCategoryCheckboxes = document.querySelectorAll('input[name="categoryFilter"]:not([value="All"])');

if (allCategoryCheckbox) {
  allCategoryCheckbox.addEventListener('change', () => {
    if (allCategoryCheckbox.checked) {
      otherCategoryCheckboxes.forEach(cb => cb.checked = false);
    }
    doSearch();
  });

  otherCategoryCheckboxes.forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) {
        allCategoryCheckbox.checked = false;
      } else {
        const anyChecked = Array.from(otherCategoryCheckboxes).some(c => c.checked);
        if (!anyChecked) allCategoryCheckbox.checked = true;
      }
      doSearch();
    });
  });
}

// ----- Handle "Any Location" -----
const allLocationCheckbox = document.querySelector('input[name="locations"][value="Any"]');
const otherLocationCheckboxes = document.querySelectorAll('input[name="locations"]:not([value="Any"])');

if (allLocationCheckbox) {
  allLocationCheckbox.addEventListener('change', () => {
    if (allLocationCheckbox.checked) {
      otherLocationCheckboxes.forEach(cb => cb.checked = false);
    }
    doSearch();
  });

  otherLocationCheckboxes.forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) {
        allLocationCheckbox.checked = false;
      } else {
        const anyChecked = Array.from(otherLocationCheckboxes).some(c => c.checked);
        if (!anyChecked) allLocationCheckbox.checked = true;
      }
      doSearch();
    });
  });
}

    
    /* ===========================
       🧠 Live Search (Typing)
       =========================== */
    // Debounce = wait 400ms after typing stops before searching
    let typingTimer;
    document.getElementById('searchText').addEventListener('input', function () {
      clearTimeout(typingTimer);
      typingTimer = setTimeout(doSearch, 400);
    });
    
    /* ===========================
       🟢 RSVP Buttons
       =========================== */
    function submitRsvp(eventId, userId) {
      fetch('/rsvp/submit', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `eventId=${eventId}&userId=${userId}&rsvpStatus=yes`
      }).then(() => {
        alert('RSVP submitted!');
        window.location.reload();
      });
    }
    
    function submitRsvpCancelled(eventId, userId) {
      fetch('/rsvp/submit', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `eventId=${eventId}&userId=${userId}&rsvpStatus=cancelled`
      }).then(() => {
        alert('RSVP cancelled!');
        window.location.reload();
      });
    }

    </script>
