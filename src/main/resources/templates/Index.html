<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Home</title>
</head>
<!-- Page-specific CSS -->
<th:block layout:fragment="css">
    <style>
        /* Search Area */
        .search_area {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            margin: 2rem;
            padding: 2rem;
            border-radius: 20px;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .search_area input[type="text"] {
            flex: 2;
            padding: 12px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .search_area input[type="text"]:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search_area select {
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search_area select:focus {
            outline: none;
            border-color: #6366f1;
        }

        .search_area input[type="date"] {
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        .search_area input[type="submit"] {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .search_area input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .search_area input[type="submit"]:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .search_area input[type="submit"]:hover:before {
            left: 100%;
        }

        /* Main Content Layout */
        .main_content {
            display: flex;
            gap: 2rem;
            margin: 2rem;
            align-items: flex-start;
        }

        /* Filter Sidebar */
        .filter {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            width: 300px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 120px;
        }

        .filter h1 {
            color: #1f2937;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            text-align: center;
        }

        .filter h2 {
            color: #374151;
            margin: 1.5rem 0 1rem 0;
            font-size: 1.1rem;
            border-bottom: 2px solid #6366f1;
            padding-bottom: 0.5rem;
        }

        .filter-group {
            margin: 0.8rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter input[type="checkbox"], .filter input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #6366f1;
        }

        .filter label {
            cursor: pointer;
            font-weight: 500;
        }

        .filter input[type="date"], .filter select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 0.5rem;
        }

        /* Events Container - Modified for 3 columns */
        .events_container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .events_card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .events_card:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
        }

        .events_card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .events_card h3 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: #1f2937;
            font-weight: 600;
        }

        .events_card p {
            color: #6b7280;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .events_card p:last-of-type {
            margin-bottom: 1.5rem;
            color: #374151;
            font-weight: 600;
        }

        /* Button container for side-by-side buttons */
        .event-buttons {
            display: flex;
            gap: 1rem;
            margin-top: auto;
        }

        .events_card button {
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            color: #1f2937;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            font-size: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .events_card button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.4);
        }

        /* View button styling */
        .view-button {
            background: linear-gradient(45deg, #6366f1, #8b5cf6) !important;
            color: white !important;
        }

        .view-button:hover {
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4) !important;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .events_container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .search_area {
                flex-direction: column;
                align-items: stretch;
                margin: 1rem;
            }

            .search_area input[type="text"] {
                min-width: auto;
            }

            .main_content {
                flex-direction: column;
                margin: 1rem;
            }

            .filter {
                width: 100%;
                position: static;
            }

            .events_container {
                grid-template-columns: 1fr;
            }

            .event-buttons {
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        /* Animation for page load */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .events_card {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .events_card:nth-child(2) { animation-delay: 0.1s; }
        .events_card:nth-child(3) { animation-delay: 0.2s; }
        .events_card:nth-child(4) { animation-delay: 0.3s; }


        /* rsvp status */
        .rsvp-status {
            cursor: default;
            pointer-events: none;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
        }

        /* Not RSVPed */
        .rsvp-status.not-rsvped {
            background: #fef3c7;
            color: #92400e;
        }

        /* RSVPed */
        .rsvp-status.rsvped {
            background: #d1fae5 ;
            color: #065f46;
        }



    </style>
</th:block>

<!-- Page Content (Navigation and Footer are handled by the layout) -->
<div layout:fragment="content">
    <!-- Search Area -->
<body>

    <div class="search_area">
        <input type="text" placeholder="Search...">
        <select name="category" id="category">
            <option value="all">All</option>
            <option value="events">Events</option>
            <option value="users">Users</option>
            <option value="groups">Groups</option>
        </select>
        <input type="date" id="date_preferred" name="date_preferred">
        <select name="location" id="location">
            <option value="any">Any Location</option>
            <option value="newyork">New York</option>
            <option value="losangeles">Los Angeles</option>
            <option value="chicago">Chicago</option>
        </select>
        <input type="submit" value="Search"/>
    </div>

    <!-- Main Content Area -->
    <div class="main_content">
        <!-- Filter Sidebar -->
        <div class="filter">
            <h1>Filters</h1>
            
            <h2>Category</h2>
            <div class="filter-group">
                <input type="checkbox" id="Academic" name="Academic" value="Academic">
                <label for="Academic">Academic</label>
            </div>
            <div class="filter-group">
                <input type="checkbox" id="Social" name="Social" value="Social">
                <label for="Social">Social</label>
            </div>
            <div class="filter-group">
                <input type="checkbox" id="Sport" name="Sport" value="Sport">
                <label for="Sport">Sport</label>
            </div>
            
            <h2>Date Range</h2>
            <input type="date" id="date_from" name="date_from">
            <input type="date" id="date_to" name="date_to">
            
            <h2>Location</h2>
            <div class="filter-group">
                <input type="checkbox" id="Main Campus" name="Main Campus" value="Main Campus">
                <label for="Main Campus">Main Campus</label>
            </div>
            <div class="filter-group">
                <input type="checkbox" id="Student Center" name="Student Center" value="Student Center">
                <label for="Student Center">Student Center</label>
            </div>
            
            <h2>Price</h2>
            <div class="filter-group">
                <input type="radio" id="free" name="price" value="free">
                <label for="free">Free</label>
            </div>
            <div class="filter-group">
                <input type="radio" id="paid" name="price" value="paid">
                <label for="paid">Paid</label>
            </div>
            
            <h2>Organizer</h2>
            <select name="organizer" id="organizer">
                <option value="any">Any Organizer</option>
                <option value="org1">Organizer 1</option>
                <option value="org2">Organizer 2</option>
                <option value="org3">Organizer 3</option>
            </select>
        </div>

        <!-- Events Container -->
        <div class="events_container">
            <!-- Loop over events -->
            <div class="events_card" th:each="event : ${events}">
                <h3 th:text="${event.title}">Event Title</h3>
                <p>
                    <span th:text="${event.eventDate.format(T(java.time.format.DateTimeFormatter).ofPattern('dd MMM yyyy'))}"></span>
                    |
                    <span th:text="${event.startTime}">Start Time</span>
                </p>
                <p th:text="${event.description} ?: 'No Description'">Event Description</p>
                <p th:text="'Location: ' + ${event.location} ?: 'No Location'">Event Location</p>
                <p th:text="${event.venueDetails} ?: 'No Venue Details'">Venue Details</p>
                
                <p th:text="${event.price == null or event.price.compareTo(T(java.math.BigDecimal).ZERO) == 0} ? 'Price: Free' : '$' + ${event.price}">Event Price</p>
                <p th:text="${event.maxCapacity} != null ? ${event.maxCapacity} + ' Attendees' : 'Unlimited Attendees'">Event Capacity</p>

                <!-- Button container -->
                <div class="event-buttons">
                    <!-- View Button -->
                    <button type="button" class="view-button" th:onclick="'window.location.href=\'/events/' + ${event.eventId} + '\''">
                        View
                    </button>

                    <!-- RSVP form and button -->
                    <div style="flex: 1;">
                        <form style="margin: 0;">
                            <input type="hidden" name="userId" th:value="${currentUser != null ? currentUser.userId : 0}" />
                            <input type="hidden" name="eventId" th:value="${event.eventId}" />
                            <input type="hidden" name="rsvpStatus" value="yes" />
                            
                            <!-- redirect to login -->
                            <button type="button"
                                th:if="${currentUser == null}"
                                onclick="window.location.href='/auth/login'">
                                Login to RSVP
                            </button>

                            <!-- Button if user has not RSVPed -->
                            <div th:if="${currentUser != null}">
                                <button type="button"
                                        th:if="${rsvpService.checkUserRsvp(event, currentUser) != 'yes'}"
                                        class="rsvp-status not-rsvped"
                                        disabled="true">
                                        Not RSVP'd
                                </button>

                                <!-- Button if user already RSVPed -->
                                <button type="button"
                                        th:if="${rsvpService.checkUserRsvp(event, currentUser) == 'yes'}"
                                        class="rsvp-status rsvped"
                                        disabled="true">
                                    RSVP'd
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
</script>

</body>
</html>
