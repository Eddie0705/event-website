<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .profile-container {
            min-height: 100vh;
            background: #f8f9fa;
            padding: 2rem 0;
        }

        .profile-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            margin: 0 auto 1rem;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .profile-body {
            padding: 2rem;
        }

        .form-floating {
            margin-bottom: 1rem;
        }

        .form-floating input,
        .form-floating textarea {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .form-floating input:focus,
        .form-floating textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .alert {
            border-radius: 10px;
            border: none;
        }

        .user-type-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .badge-student {
            background: #e3f2fd;
            color: #1976d2;
        }

        .badge-organiser {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .badge-admin {
            background: #ffebee;
            color: #d32f2f;
        }
    </style>
</head>

<body>
    <div class="profile-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="profile-card">
                        <div class="profile-header">
                            <div class="profile-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <h3 th:text="${user.firstName + ' ' + user.lastName}">User Name</h3>
                            <p class="mb-0" th:text="${user.email}">user@example.com</p>
                            <span class="user-type-badge"
                                th:classappend="${user.userType.name() == 'STUDENT'} ? 'badge-student' : 
                                                (${user.userType.name() == 'ORGANISER'} ? 'badge-organiser' : 'badge-admin')"
                                th:text="${user.userType.name()}">STUDENT</span>
                        </div>

                        <div class="profile-body">
                            <!-- Success Message -->
                            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                                <i class="fas fa-check-circle"></i>
                                <span th:text="${successMessage}"></span>
                            </div>

                            <!-- Error Message -->
                            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                                <i class="fas fa-exclamation-triangle"></i>
                                <span th:text="${errorMessage}"></span>
                            </div>

                            <!-- Profile Form -->
                            <form th:action="@{/auth/profile}" th:object="${user}" method="post">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" id="firstName"
                                                th:field="*{firstName}" placeholder="First Name" required>
                                            <label for="firstName">First Name</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" id="lastName" th:field="*{lastName}"
                                                placeholder="Last Name" required>
                                            <label for="lastName">Last Name</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-floating">
                                    <input type="email" class="form-control" id="email" th:field="*{email}"
                                        placeholder="Email Address" required>
                                    <label for="email">Email Address</label>
                                </div>

                                <div class="form-floating">
                                    <input type="text" class="form-control" id="username" th:field="*{username}"
                                        placeholder="Username" required>
                                    <label for="username">Username</label>
                                </div>

                                <div class="form-floating">
                                    <textarea class="form-control" id="bio" th:field="*{bio}" placeholder="Bio"
                                        style="height: 100px"></textarea>
                                    <label for="bio">Bio</label>
                                </div>

                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary btn-save">
                                        <i class="fas fa-save"></i> Save Changes
                                    </button>
                                </div>
                            </form>

                            <!-- Change Password Section -->
                            <hr class="my-4">
                            <h5>Change Password</h5>
                            <form th:action="@{/auth/change-password}" method="post">
                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control" id="currentPassword"
                                        name="currentPassword" placeholder="Current Password" required>
                                    <label for="currentPassword">Current Password</label>
                                </div>

                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control" id="newPassword" name="newPassword"
                                        placeholder="New Password" required>
                                    <label for="newPassword">New Password</label>
                                </div>

                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control" id="confirmNewPassword"
                                        name="confirmPassword" placeholder="Confirm New Password" required>
                                    <label for="confirmNewPassword">Confirm New Password</label>
                                </div>

                                <div class="d-grid">
                                    <button type="submit" class="btn btn-outline-primary">
                                        <i class="fas fa-key"></i> Change Password
                                    </button>
                                </div>
                            </form>

                            <!-- Account Info -->
                            <hr class="my-4">
                            <h5>Account Information</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <p><strong>Member since:</strong> <span
                                            th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">01 Jan
                                            2024</span></p>
                                    <p><strong>Last login:</strong>
                                        <span th:if="${user.lastLogin}"
                                            th:text="${#temporals.format(user.lastLogin, 'dd MMM yyyy HH:mm')}">01 Jan
                                            2024 10:30</span>
                                        <span th:unless="${user.lastLogin}" class="text-muted">Never</span>
                                    </p>
                                </div>
                                <div class="col-md-6">
                                    <p><strong>Account status:</strong>
                                        <span th:if="${user.isActive}" class="text-success">Active</span>
                                        <span th:unless="${user.isActive}" class="text-danger">Inactive</span>
                                    </p>
                                    <p><strong>Email verified:</strong>
                                        <span th:if="${user.emailVerified}" class="text-success">Yes</span>
                                        <span th:unless="${user.emailVerified}" class="text-warning">No</span>
                                    </p>
                                </div>
                            </div>

                            <div class="text-center mt-4">
                                <a href="/" class="btn btn-outline-secondary">
                                    <i class="fas fa-home"></i> Back to Home
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
