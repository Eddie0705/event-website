<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Calendar - EventHub</title>
    <style>
        body { background:#f8f9fa !important; }
        .calendar-container { display:flex; min-height:calc(100vh - 140px); gap:20px; padding:20px; }
        .calendar-main { flex:1; background:#fff; border-radius:12px; padding:18px; box-shadow:0 2px 10px rgba(0,0,0,.06); }

        .calendar-header { display:flex; justify-content:space-between; align-items:center;
            border-bottom:1px solid #e9ecef; padding-bottom:12px; margin-bottom:16px; }
        .calendar-nav { display:flex; gap:10px; align-items:center; }

        /* Button styles (anchors styled like buttons) */
        .btn { display:inline-block; cursor:pointer; text-decoration:none; }
        .btn-today { background:#007bff; color:#fff; border-radius:6px; padding:8px 14px; font-weight:600; }
        .btn-nav { background:#f8f9fa; border:1px solid #dee2e6; color:#111; border-radius:6px; padding:8px 12px; }
        .calendar-title { margin:0 10px; font-size:22px; font-weight:700; }

        .view-toggle { display:flex; background:#f1f3f5; border-radius:8px; padding:4px; gap:4px; }
        .view-link { border:none; background:transparent; padding:8px 16px; border-radius:6px; font-weight:600; text-decoration:none; color:#111; }
        .view-link.active { background:#007bff; color:#fff; }

        .month-grid { display:grid; grid-template-columns:repeat(7,1fr); border:1px solid #e9ecef; border-radius:8px; overflow:hidden; }
        .dow { background:#f8f9fa; padding:10px; text-align:center; font-weight:700; border-right:1px solid #e9ecef; }
        .dow:last-child { border-right:none; }

        .day { min-height:120px; padding:8px; border-right:1px solid #f1f3f5; border-top:1px solid #f1f3f5; background:#fff; }
        .day:nth-child(7n) { border-right:none; }
        .day.other { background:#fafbfc; color:#adb5bd; }
        .day.today { background:#e7f1ff; }
        .day-number { font-weight:700; }

        .event-pill { font-size:12px; margin:2px 0; padding:2px 6px; border-radius:4px;
            background:#e3f2fd; border-left:3px solid #1976d2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        .week-grid { display:grid; grid-template-columns:repeat(7,1fr); border:1px solid #e9ecef; border-radius:8px; overflow:hidden; }
        .week-day { min-height:150px; padding:8px; border-right:1px solid #f1f3f5; border-top:1px solid #f1f3f5; background:#fff; }
        .week-day:nth-child(7n) { border-right:none; }
        .week-day.today { background:#e7f1ff; }
    </style>
</head>
<body>
<div layout:fragment="content" class="calendar-container">

    <!-- data-* kept for possible JS enhancements -->
    <div class="calendar-main"
         th:attr="data-view=${view},data-anchor=${#temporals.format(anchorDate,'yyyy-MM-dd')}">

        <!-- HEADER -->
        <div class="calendar-header">
            <div class="calendar-nav">
                <!-- Today -->
                <a class="btn btn-today"
                   th:href="@{/calendar(view=${view}, date=${#temporals.format(today,'yyyy-MM-dd')})}">
                    Today
                </a>

                <!-- Prev / Next (use server-calculated prevDate/nextDate) -->
                <a class="btn btn-nav"
                   th:href="@{/calendar(view=${view}, date=${#temporals.format(prevDate,'yyyy-MM-dd')})}">‹</a>
                <a class="btn btn-nav"
                   th:href="@{/calendar(view=${view}, date=${#temporals.format(nextDate,'yyyy-MM-dd')})}">›</a>

                <!-- Title -->
                <h2 class="calendar-title"
                    th:text="${#temporals.format(view=='week' ? calendarData.weekStart : yearMonth.atDay(1), 'MMMM yyyy')}">
                    Month YYYY
                </h2>
            </div>

            <!-- View toggle: always keep same anchor date, swap view -->
            <div class="view-toggle">
                <a class="view-link" th:classappend="${view=='week'} ? ' active' : ''"
                   th:href="@{/calendar(view='week', date=${#temporals.format(anchorDate,'yyyy-MM-dd')})}">
                    Week
                </a>
                <a class="view-link" th:classappend="${view=='month'} ? ' active' : ''"
                   th:href="@{/calendar(view='month', date=${#temporals.format(anchorDate,'yyyy-MM-dd')})}">
                    Month
                </a>
            </div>
        </div>

        <!-- MONTH VIEW -->
        <div class="month-grid" th:if="${view == 'month'}">
            <div class="dow">MON</div><div class="dow">TUE</div><div class="dow">WED</div>
            <div class="dow">THU</div><div class="dow">FRI</div><div class="dow">SAT</div><div class="dow">SUN</div>

            <div th:each="d : ${calendarData.monthDays}"
                 th:class="'day' + (${d.monthValue != yearMonth.monthValue} ? ' other' : '') + (${d.equals(today)} ? ' today' : '')"
                 th:attr="data-date=${#temporals.format(d,'yyyy-MM-dd')}"
                 onclick="selectDate(this.dataset.date)">
                <div class="day-number" th:text="${d.dayOfMonth}">1</div>

                <div th:if="${eventsByDate[d]}">
                    <div th:each="e : ${eventsByDate[d]}"
                         th:class="'event-pill'"
                         th:title="${e.description}" th:text="${e.eventName}">
                    </div>
                </div>
            </div>
        </div>

        <!-- WEEK VIEW -->
        <div class="week-grid" th:if="${view == 'week'}">
            <div class="dow">MON</div><div class="dow">TUE</div><div class="dow">WED</div>
            <div class="dow">THU</div><div class="dow">FRI</div><div class="dow">SAT</div><div class="dow">SUN</div>

            <div th:each="d : ${calendarData.weekDays}"
                 th:class="'week-day' + (${d.equals(today)} ? ' today' : '')"
                 th:attr="data-date=${#temporals.format(d,'yyyy-MM-dd')}"
                 onclick="selectDate(this.dataset.date)">
                <div class="day-number" th:text="${d.dayOfMonth}">1</div>

                <div th:if="${eventsByDate[d]}">
                    <div th:each="e : ${eventsByDate[d]}"
                         th:class="'event-pill'"
                         th:title="${e.description}" th:text="${e.eventName}">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Minimal JS: only for date click (navigation links use server URLs) -->
<script>
  function selectDate(iso){
    console.log('Selected date:', iso);
    // You can navigate to a day view or open a modal here later.
  }
</script>
</body>
</html>
