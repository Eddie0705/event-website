<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - EventHub">EventHub</title>
    
    <!-- Common CSS from your existing style.css -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #0f172a 100%);
            min-height: 100vh;
            color: #333;
        }

        /* Navigation - Using your exact styling */
        .nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .right-nav {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fbbf24 !important;
            text-decoration: none;
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .mid-nav {
            display: flex;
            gap: 2rem;
        }

        .mid-nav a, .right-nav a {
            text-decoration: none;
            color: #374151;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
        }

        .mid-nav a:hover, .right-nav a:hover {
            background: #6366f1;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .right-nav {
            display: flex;
            gap: 1rem;
        }

        /* Profile Dropdown Styles */
        .profile-dropdown {
            position: relative;
        }

        .profile-dropdown .profile {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .dropdown-arrow {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        .profile-dropdown.active .dropdown-arrow {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 1000;
            margin-top: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .dropdown-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 12px 16px;
            color: #374151;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border-radius: 8px;
            margin: 4px;
        }

        .dropdown-item:hover {
            background: #f3f4f6;
            color: #1f2937;
            transform: translateX(4px);
        }

        .dropdown-item:first-child {
            font-weight: 600;
            color: #1f2937;
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .dropdown-item:first-child:hover {
            background: #fef3c7;
            -webkit-text-fill-color: #1f2937;
        }

        .dropdown-item.logout {
            color: #dc2626;
        }

        .dropdown-item.logout:hover {
            background: #fee2e2;
            color: #b91c1c;
        }

        .dropdown-icon {
            font-size: 1.1rem;
            width: 20px;
            display: flex;
            justify-content: center;
        }

        .dropdown-divider {
            height: 1px;
            background: #e5e7eb;
            margin: 4px 8px;
        }


        /* User greeting and navigation */
        .welcome-greeting {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: linear-gradient(45deg, rgba(251, 191, 36, 0.1), rgba(245, 158, 11, 0.1));
            border-radius: 8px;
            color: #374151;
            font-weight: 500;
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .profile-btn {
            background: linear-gradient(45deg, #fbbf24, #f59e0b) !important;
            color: #1f2937 !important;
            font-weight: 600 !important;
            border: none;
            transition: all 0.3s ease;
        }

        .profile-btn:hover {
            background: linear-gradient(45deg, #f59e0b, #d97706) !important;
            color: #1f2937 !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4) !important;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1) !important;
            color: #dc2626 !important;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .logout-btn:hover {
            background: #dc2626 !important;
            color: white !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3) !important;
        }

        .user-type-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .user-type-organiser {
            background: #fbbf24;
            color: #1f2937;
        }

        .user-type-admin {
            background: #ef4444;
            color: white;
        }

        .user-type-student {
            background: #10b981;
            color: white;
        }

        /* Debug user type display */
        .debug-user-type {
            color: #dc2626;
            font-weight: bold;
            font-size: 0.9rem;
            background: rgba(220, 38, 38, 0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            border: 1px solid rgba(220, 38, 38, 0.2);
        }

        /* Logout button styling */
        .logout-btn {
            background: none;
            border: none;
            text-decoration: none;
            color: #374151;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
        }

        .logout-btn:hover {
            background: #6366f1;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* Main content area */
        .main-content {
            min-height: calc(100vh - 140px);
        }

        /* Footer - Using your exact styling */
        footer {
            background: rgba(31, 41, 55, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
        }

        /* Responsive Design - Your exact styles */
        @media (max-width: 768px) {
            .nav {
                flex-direction: column;
                gap: 1rem;
            }

            .mid-nav {
                flex-wrap: wrap;
                gap: 1rem;
            }

            .main-content {
                padding: 1rem;
            }
        }

        /* Alerts and notifications */
        .alert {
            padding: 1rem 1.5rem;
            margin: 1rem 2rem;
            border-radius: 8px;
            font-weight: 500;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        /* Animation for page load */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeInUp 0.6s ease-out forwards;
        }
    </style>
    
    <!-- Page-specific CSS -->
    <th:block layout:fragment="css"></th:block>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav"> 
        <div class="left-nav">
            <a class="logo" th:href="@{/}">EVENTHUB</a>
        </div>
        <div class="mid-nav">
            <a class="home" th:href="@{/}">Home</a> 
            <a class="explore" th:href="@{/explore}">Explore</a> 
            <a class="calendar" th:href="@{/calendar}">Calendar</a> 
            <a class="rsvp" th:href="@{/eventRSVP}">RSVP</a>
            <th:block th:if="${currentUser != null and (currentUser.userType.name() == 'ORGANISER' or currentUser.userType.name() == 'ADMIN')}">
                <a th:href="@{/organiser/create-event}" class="profile-btn">Create Event</a>
            </th:block>
        </div> 
        <div class="right-nav">
            <a class="noti" href="/noti">Notifications</a>  
            <div class="profile-dropdown">
                <a class="profile" href="#" onclick="toggleDropdown(event)">
                    Profile <span class="dropdown-arrow">▼</span>
                </a>
                <div class="dropdown-menu" id="profileDropdown">
                    <a href="user/profile" class="dropdown-item">
                        <span class="dropdown-icon">👤</span>
                        <span th:text="${currentUser != null ? currentUser.firstName + ' ' + currentUser.lastName: 'Log In'}"></span>
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="/rsvp" class="dropdown-item">
                        <span class="dropdown-icon">📅</span>
                        RSVP
                    </a> 
                    <a href="/myevents" class="dropdown-item">
                        <span class="dropdown-icon">🎯</span>
                        My Events
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="/logout" class="dropdown-item logout">
                        <span class="dropdown-icon">🚪</span>
                        Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Flash Messages -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div layout:fragment="content">
            <!-- Page content will be inserted here -->
        </div>
    </div>

    <!-- Footer -->
    <footer style="padding: 1rem 0;">
    <div style="display:flex; justify-content:space-between; align-items:center; max-width:1000px; margin:0 auto; padding:0 1rem;">
        <p style="margin:0;">&copy; 2024 EventHub. All rights reserved.</p> 
        <a href="https://github.com/cosc2299-2025/team-project-group-p03-03" target="_blank" rel="noopener noreferrer">
            <img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/github-white-icon.png"
                alt="GitHub"
                width="40"
                height="40" />
        </a>
    </div>  
</footer>

    <!-- Page-specific JavaScript -->
    <th:block layout:fragment="javascript">
         <script>
            // Profile dropdown functionality
            function toggleDropdown(event) {
                event.preventDefault();
                event.stopPropagation();
                
                const dropdown = document.getElementById('profileDropdown');
                const profileDropdown = document.querySelector('.profile-dropdown');
                
                dropdown.classList.toggle('show');
                profileDropdown.classList.toggle('active');
            }
    
            // Close dropdown when clicking outside
            document.addEventListener('click', function(event) {
                const dropdown = document.getElementById('profileDropdown');
                const profileDropdown = document.querySelector('.profile-dropdown');
                
                if (!profileDropdown.contains(event.target)) {
                    dropdown.classList.remove('show');
                    profileDropdown.classList.remove('active');
                }
            });    
        </script>
    </th:block>
</body>
</html>
