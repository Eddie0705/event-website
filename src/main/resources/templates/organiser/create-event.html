<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Create Event</title>
</head>

<th:block layout:fragment="css">
    <style>
        /* Override main content styling */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: calc(100vh - 140px);
            padding: 40px 20px;
        }

        .create-event-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            position: relative;
            overflow: hidden;
        }

        .create-event-container:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
        }

        .page-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: #6b7280;
            font-size: 1rem;
            font-weight: 500;
        }

        .form-row {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
            flex: 1;
        }

        .form-group.full-width {
            flex: 1 1 100%;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #374151;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #ffffff;
            color: #1f2937;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
            background: #fffbf0;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #9ca3af;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e7eb;
        }

        .btn {
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            color: #1f2937;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 2px solid #d1d5db;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
            border-color: #9ca3af;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-primary:hover:before {
            left: 100%;
        }

        /* Alert Messages */
        .alert-message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        /* Preview Section */
        .event-preview {
            background: #f9fafb;
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 2rem;
        }

        .event-preview h3 {
            color: #374151;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .preview-content {
            color: #6b7280;
        }

        .preview-content.has-content {
            color: #1f2937;
        }

        .preview-item {
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Loading state */
        .loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .loading .btn-primary {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* Animations */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .create-event-container {
            animation: slideInUp 0.6s ease-out;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            
            .form-actions {
                flex-direction: column-reverse;
            }
            
            .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .create-event-container {
                padding: 2rem 1.5rem;
                margin: 10px;
            }
            
            .page-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</th:block>

<div layout:fragment="content">
    <div class="create-event-container">
        <div class="page-header">
            <h1>Create New Event</h1>
            <p>Share your amazing event with the world</p>
        </div>

        <!-- Error Messages -->
        <div th:if="${errorMessage}" class="alert-message alert-error" th:text="${errorMessage}">
            Error message here
        </div>

        <!-- Success Messages -->
        <div th:if="${successMessage}" class="alert-message alert-success" th:text="${successMessage}">
            Success message here
        </div>

        <!-- Event Creation Form -->
        <form action="/events/create" method="post" id="eventForm">
            <div class="form-group full-width">
                <label for="title">Event Title *</label>
                <input type="text" id="title" name="title" 
                       placeholder="Enter an engaging title for your event" 
                       maxlength="255" required>
            </div>

            <div class="form-group full-width">
                <label for="description">Event Description *</label>
                <textarea id="description" name="description" rows="4" 
                          placeholder="Describe what makes your event special..." 
                          required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="eventDate">Event Date *</label>
                    <input type="date" id="eventDate" name="eventDate" required>
                </div>
                <div class="form-group">
                    <label for="startTime">Start Time *</label>
                    <input type="time" id="startTime" name="startTime" required>
                </div>
                <div class="form-group">
                    <label for="endTime">End Time *</label>
                    <input type="time" id="endTime" name="endTime" required>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="location">Event Location *</label>
                <input type="text" id="location" name="location" 
                       placeholder="Where will your event take place?" 
                       maxlength="500" required>
            </div>

            <div class="form-group full-width">
                <label for="venueDetails">Venue Details (Optional)</label>
                <textarea id="venueDetails" name="venueDetails" rows="2" 
                          placeholder="Additional venue information, directions, or special instructions..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="maxCapacity">Maximum Capacity *</label>
                    <input type="number" id="maxCapacity" name="maxCapacity" 
                           placeholder="e.g., 100" min="1" max="10000" required>
                </div>
            </div>

            <!-- Event Preview -->
            <div class="event-preview">
                <h3>Event Preview</h3>
                <div class="preview-content">
                    <div class="preview-item">
                        <span>📅</span>
                        <span id="preview-title">Your event title will appear here</span>
                    </div>
                    <div class="preview-item">
                        <span>📝</span>
                        <span id="preview-description">Your event description will appear here</span>
                    </div>
                    <div class="preview-item">
                        <span>🗓️</span>
                        <span id="preview-datetime">Event date and time</span>
                    </div>
                    <div class="preview-item">
                        <span>📍</span>
                        <span id="preview-location">Event location</span>
                    </div>
                    <div class="preview-item">
                        <span>👥</span>
                        <span>Max <span id="preview-capacity">0</span> attendees</span>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <a href="/" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    Create Event
                </button>
            </div>
        </form>
    </div>
</div>

<th:block layout:fragment="javascript">
    <script>
        // Set minimum date to today
        document.addEventListener('DOMContentLoaded', function() {
            const dateInput = document.getElementById('eventDate');
            const today = new Date().toISOString().split('T')[0];
            dateInput.min = today;
            
            // Initialize preview
            updatePreview();
        });

        // Live preview functionality
        function updatePreview() {
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const eventDate = document.getElementById('eventDate').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const location = document.getElementById('location').value;
            const capacity = document.getElementById('maxCapacity').value;

            // Update preview elements
            document.getElementById('preview-title').textContent = title || 'Your event title will appear here';
            document.getElementById('preview-description').textContent = description || 'Your event description will appear here';
            document.getElementById('preview-location').textContent = location || 'Event location';
            document.getElementById('preview-capacity').textContent = capacity || '0';

            // Format date and time
            let dateTimeText = 'Event date and time';
            if (eventDate) {
                const date = new Date(eventDate);
                dateTimeText = date.toLocaleDateString();
                
                if (startTime && endTime) {
                    dateTimeText += ` from ${startTime} to ${endTime}`;
                } else if (startTime) {
                    dateTimeText += ` at ${startTime}`;
                }
            }
            document.getElementById('preview-datetime').textContent = dateTimeText;

            // Update styling based on content
            updatePreviewStyling();
        }

        function updatePreviewStyling() {
            const previewItems = document.querySelectorAll('.preview-content span:not(.preview-item span:first-child)');
            previewItems.forEach(item => {
                const parent = item.closest('.preview-item');
                if (item.textContent && !item.textContent.includes('will appear here') && 
                    !item.textContent.includes('Event ') && item.textContent !== '0') {
                    parent.classList.add('has-content');
                } else {
                    parent.classList.remove('has-content');
                }
            });
        }

        // Add event listeners for live preview
        ['title', 'description', 'eventDate', 'startTime', 'endTime', 'location', 'maxCapacity'].forEach(id => {
            document.getElementById(id).addEventListener('input', updatePreview);
        });

        // Time validation
        function validateTimes() {
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const endTimeInput = document.getElementById('endTime');
            
            if (startTime && endTime && endTime <= startTime) {
                endTimeInput.setCustomValidity('End time must be after start time');
            } else {
                endTimeInput.setCustomValidity('');
            }
        }

        document.getElementById('startTime').addEventListener('change', validateTimes);
        document.getElementById('endTime').addEventListener('change', validateTimes);

        // Form submission handling
        document.getElementById('eventForm').addEventListener('submit', function() {
            const submitBtn = document.getElementById('submitBtn');
            const form = document.getElementById('eventForm');
            
            // Add loading state
            form.classList.add('loading');
            submitBtn.textContent = 'Creating Event...';
        });

        // Auto-focus first field
        document.getElementById('title').focus();
    </script>
</th:block>
</html>
