# EventHub Database Configuration
# src/main/resources/application.properties

# =============================================
# DATABASE CONNECTION SETTINGS
# =============================================

# base URL
app.base-url=https://localhost:8080

# Local MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/eventhub_db?useSSL=false&serverTimezone=Australia/Melbourne&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA/HIBERNATE SETTINGS
# =============================================

# Don't let Hibernate auto-create tables (we have our own schema)
spring.jpa.hibernate.ddl-auto=none

# Show SQL queries in console (helpful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use MySQL 8 dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =============================================
# CONNECTION POOL SETTINGS
# =============================================

# HikariCP connection pool configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# =============================================
# SERVER SETTINGS
# =============================================

# Server port (default is 8080)
server.port=8080

# =============================================
# LOGGING SETTINGS
# =============================================

# Show SQL parameters (for debugging)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# General application logging
logging.level.au.edu.rmit.sept.webapp=INFO
logging.level.org.springframework.web=INFO

# =============================================
# ACTUATOR SETTINGS (since you have actuator)
# =============================================

# Show health details
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics

# =============================================
# THYMELEAF SETTINGS (since you're using Thymeleaf)
# =============================================

# Cache templates in production, but not in development
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =============================================
# APPLICATION INFO
# =============================================

# Application information
spring.application.name=EventHub WebApp
info.app.name=EventHub Campus Event Management
info.app.description=COSC2299 SEPT WebApplication
info.app.version=0.0.1-SNAPSHOT

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG

# =============================================
# SECURITY SETTINGS
# =============================================

# Session configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Session store type
spring.session.store-type=none

# JPA settings that might affect sessions
spring.jpa.open-in-view=false


